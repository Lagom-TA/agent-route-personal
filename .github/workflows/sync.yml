name: Verified rule mirror

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0,6,12,18 * * *'
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: agentroute-mirror
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -v
  prepare:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -m agentroute_sync.mirror prepare --out "$RUNNER_TEMP/mirror"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-public-data
          path: |
            ${{ runner.temp }}/mirror/data
            ${{ runner.temp }}/mirror/docs
          retention-days: 7
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: verified-public-data
          path: mirror-artifact
      - run: python -m agentroute_sync.mirror publish --repo "$GITHUB_REPOSITORY" --out mirror-artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
